services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    network_mode: host
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/synonyx.db
      - KB_DIR=/app/synonyx_base
    volumes:
      - backend_data:/app/data
      - ./synonyx_base:/app/synonyx_base:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    network_mode: host
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
