services:
  backend:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./data:/data
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MODEL_ID=${MODEL_ID}
      - OPENROUTER_MODEL_ID=${OPENROUTER_MODEL_ID}
      - INPUT_PRICE_PER_1M=${INPUT_PRICE_PER_1M:-0.05}
      - OUTPUT_PRICE_PER_1M=${OUTPUT_PRICE_PER_1M:-0.10}
      - KB_DIR=/data/kb
    ports:
      - "8000:8000"

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend
