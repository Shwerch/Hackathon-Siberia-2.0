services:
  backend:
    build:
      context: ./backend
      network: host
    network_mode: host
    volumes:
      - ./backend:/app
      - ./data:/data
    environment:
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://127.0.0.1:8080/v1}
      - OPENAI_API_KEY=${OPENROUTER_API_KEY:-no-key}
      - MODEL_ID=${MODEL_ID:-local-model}
      - OPENROUTER_MODEL_ID=${OPENROUTER_MODEL_ID:-qwen/qwen-2.5-7b-instruct}
      - INPUT_PRICE_PER_1M=${INPUT_PRICE_PER_1M:-0.05}
      - OUTPUT_PRICE_PER_1M=${OUTPUT_PRICE_PER_1M:-0.10}
      - KB_DIR=/data/kb


  frontend:
    image: node:20-alpine
    network_mode: host
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
